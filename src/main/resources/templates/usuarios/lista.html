<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gestión de Usuarios')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0">Gestión de Usuarios y Perfiles (CRUD 1)</h3>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo Usuario</a>
    </div>

    <div th:if="${exito}" class="alert alert-success py-2" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Nombre Completo</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td class="fw-semibold" th:text="${u.username}"></td>
                        <td th:text="${u.nombreCompleto}"></td>
                        <td th:text="${u.email}"></td>
                        <td><span class="badge bg-secondary" th:text="${u.rol.nombre}"></span></td>
                        <td>
                            <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                            <span th:unless="${u.activo}" class="badge bg-danger">Baja lógica</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/usuarios/{id}(id=${u.id})}" class="btn btn-outline-info btn-sm">Ver</a>
                            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-outline-primary btn-sm">Editar</a>
                            <form th:if="${u.activo}" th:action="@{/usuarios/baja/{id}(id=${u.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Dar de baja</button>
                            </form>
                            <form th:unless="${u.activo}" th:action="@{/usuarios/reactivar/{id}(id=${u.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-success btn-sm">Reactivar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
