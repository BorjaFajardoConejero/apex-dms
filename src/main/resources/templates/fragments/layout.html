<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Apex DMS'">Apex DMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">Apex DMS <span class="badge bg-primary ms-1">Cloud</span></a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Inicio</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios y Roles</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link disabled" href="#">Taller (Sprint 2)</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','ASESOR')">
                    <a class="nav-link disabled" href="#">Clientes y Vehículos (Sprint 2)</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','ASESOR','MECANICO')">
                    <a class="nav-link disabled" href="#">Órdenes de Reparación (Sprint 3)</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-light gap-3">
                <span class="small">Usuario: <strong sec:authentication="name"></strong></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
