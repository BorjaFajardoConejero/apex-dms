<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión | Apex DMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0 fw-bold">Apex DMS</h4>
                    <small class="text-secondary">Plataforma SaaS de Gestión de Taller</small>
                </div>
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger py-2 small">
                        Usuario o contraseña incorrectos, o cuenta desactivada.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2 small">
                        Sesión cerrada correctamente.
                    </div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Usuario</label>
                            <input type="text" name="username" class="form-control" placeholder="admin / asesor / mecanico" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">Acceder al sistema</button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center small text-muted py-2">
                    Proyecto Ingeniería del Software (47GIIN - VIU)
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
