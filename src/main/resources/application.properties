# Configuración del servidor Apex DMS
server.port=8080
spring.application.name=Apex DMS

# Conexión a MySQL (compatible con XAMPP / MySQL local / Cloud)
spring.datasource.url=jdbc:mysql://localhost:3306/apex_dms?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
